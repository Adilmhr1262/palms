services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: palms
      POSTGRES_PASSWORD: palms
      POSTGRES_DB: palms
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://palms:palms@db:5432/palms
      JWT_SECRET: change-me-to-a-long-random-string
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads
    command: sh -c "alembic upgrade head && python -m app.seed.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
